<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC Track School 賽道分析器</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0f0f0f;--fg:#f5f5f5;--muted:#d0d0d0;--rule:#333;--a:#ff6a00;--err:#ff6f61;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:440px;margin:0 auto;padding:48px 16px}
h1{font-size:30px;line-height:1.2;margin:0 0 24px;padding-bottom:16px;border-bottom:3px solid var(--a)}
label{display:block;margin:0 0 16px;color:var(--muted);font-size:17px}
input[type=text],input[type=password]{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;color:var(--fg);background:#1a1a1a;border:1px solid #5c5c5c;border-radius:8px}
input:focus{outline:2px solid var(--a);outline-offset:1px;border-color:var(--a)}
.rm{display:flex;gap:10px;align-items:center;font-size:16px}
.rm input{width:20px;height:20px;accent-color:var(--a)}
button{width:100%;margin-top:8px;padding:14px;font-weight:700;font-size:20px;line-height:1.2;font-family:inherit;color:#0f0f0f;background:var(--a);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.e{min-height:1.6em;margin:12px 0 0;color:var(--err)}
.h{margin-top:28px;font-size:15px;color:#a8a8a8}
.h a{color:var(--a)}
</style>
</head>
<body>
<main id="gate" hidden>
<h1>KYC Track School<br>賽道分析器</h1>
<form id="form" autocomplete="on">
<label>帳號<input type="text" id="user" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
<label>密碼<input type="password" id="pass" autocomplete="current-password" required></label>
<label class="rm"><input type="checkbox" id="remember" checked>記住我（這台裝置下次不用再輸入）</label>
<button id="go">登入</button>
<p class="e" id="err" role="alert"></p>
</form>
<p class="h">只有知道帳號密碼的車友能使用。<a href="privacy.html">隱私權政策</a></p>
</main>

var KEY='kycGate';
var $=function(id){return document.getElementById(id)};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function dec(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(LOCK.iv)},k,b64(DATA))}).then(function(pt){return new TextDecoder().decode(pt)})}
function derive(u,p){var enc=new TextEncoder();u=u.trim().toLowerCase();
  return crypto.subtle.digest('SHA-256',enc.encode('kyc-track-school|'+u)).then(function(salt){
    return crypto.subtle.importKey('raw',enc.encode(u+'\n'+p),'PBKDF2',false,['deriveBits']).then(function(base){
      return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(salt),iterations:LOCK.it},base,256)})}).then(function(b){return new Uint8Array(b)})}
function show(html){document.open();document.write(html);document.close()}
function ask(msg){$('gate').hidden=false;if(msg)$('err').textContent=msg;try{$('user').focus()}catch(e){}}
if(!window.crypto||!crypto.subtle){ask('這個瀏覽器不支援，請用 Chrome 或 Safari 開啟。');return}
var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
(saved?dec(b64(saved)).then(show,function(){try{localStorage.removeItem(KEY)}catch(e){}ask()}):Promise.resolve(ask()));
$('form').addEventListener('submit',function(ev){ev.preventDefault();var b=$('go');b.disabled=true;b.textContent='確認中…';$('err').textContent='';
  derive($('user').value,$('pass').value).then(function(raw){return dec(raw).then(function(html){
    if($('remember').checked){try{localStorage.setItem(KEY,tob64(raw))}catch(e){}}
    show(html)})}).catch(function(){$('err').textContent='帳號或密碼不對，請再試一次。';b.disabled=false;b.textContent='登入';$('pass').select()})});
})();
